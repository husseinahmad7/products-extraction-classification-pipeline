[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "products-extraction-classification-pipeline"
version = "0.1.0a1"
description = "Evidence-first, declarative extraction and classification"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5", "rfc8785>=0.1.4,<1", "beautifulsoup4>=4.12,<5", "httpx>=0.28,<1", "PyYAML>=6,<7", "regex>=2024.11"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.37,<3", "psycopg[binary]>=3.2,<4", "boto3>=1.35,<2", "argon2-cffi>=23.1,<26", "alembic>=1.14,<2"]
browser = ["playwright>=1.50,<2"]
pdf = ["docling>=2.20,<3"]
ml = ["scikit-learn>=1.6,<2"]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "hypothesis>=6.125,<7", "ruff>=0.11,<1", "mypy>=1.15,<3", "build>=1.2,<2", "types-PyYAML", "types-jsonschema", "types-beautifulsoup4"]

[project.scripts]
product-pipeline = "product_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/product_pipeline"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/schemas", "/tests", "/scripts", "/docs", "/benchmarks/*.py", "/benchmarks/reports", "/benchmarks/release-manifest.json", "/README.md", "/LICENSE", "/NOTICE", "/SECURITY.md", "/pyproject.toml", "/uv.lock", "/alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
